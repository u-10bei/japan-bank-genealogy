  note: 1878年12月4日開業免状下付・設立、1879年1月11日開業。1885年5月7日第百四十九国立銀行を合併、5月28日郵便汽船三菱会社（1886年3月三菱社に改称）が経営を継承。1895年7月20日設置の三菱合資会社銀行部に業務を順次移譲。1898年12月3日営業満期解散（1899年5月6日清算完了）
