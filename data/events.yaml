# 変遷イベント
#
# date : 発生日 YYYY / YYYY-MM / YYYY-MM-DD
# type : merger         新設合併・対等合併（from の銀行が消え、to が生まれる）
#        absorption     吸収合併（from が to に吸収され、to は存続）
#        rename         商号変更
#        reorganization 分割・再編（from 複数 → to 複数 など）
#        transfer       事業譲渡（破綻行の受け皿など）
#        failure        経営破綻・国有化（to は省略可）
# from : 変遷前の銀行IDのリスト
# to   : 変遷後の銀行IDのリスト
# note : 補足（任意）
# sources: 出典URLのリスト（任意だが推奨）

