  from: [yasuda]
  to: [fuji]

- date: "1971-10-01"
  type: merger
  from: [dai-ichi, kangyo]
  to: [dkb]

- date: "2002-04-01"
  type: reorganization
  from: [dkb, fuji, ibj]
